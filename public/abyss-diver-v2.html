<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#02070f"><title>아비스 다이버</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --abyss:#02070f; --deep:#06213c; --mid:#0b3d63; --sun:#1b6f9e;
    --ink:#e8f1f7; --ink-dim:#9fb8c9; --ink-mute:#5f7d93;
    --brass:#f2b950; --brass-dark:#a8751f; --coin:#ffd166; --cta:#ffb020;
    --panel:#08182a; --panel-2:#0c2136; --panel-edge:#173a58;
    --good:#5ee0a0; --bad:#ff6b6b; --pearl:#dfe9f5;
    --display:'Jua','Noto Sans KR',system-ui,sans-serif;
    --body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--abyss);color:var(--ink);font-family:var(--body);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--abyss);position:relative;overflow:hidden}

  /* ---------- HUD ---------- */
  .hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;gap:12px;pointer-events:none;background:linear-gradient(rgba(2,7,15,.75),rgba(2,7,15,0))}
  .depth{display:flex;flex-direction:column;gap:2px}
  .depth .num{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .depth .num small{font-size:18px;color:var(--ink-dim);margin-left:2px}
  .depth .zone{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
  .depth .hull{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--ink-dim)}
  .depth .hull .bar{width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .depth .hull .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
  .depth .hull.warn .bar i{background:var(--bad)}
  .stats{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .stat{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
  .stat.sub{font-size:13px;font-family:var(--body);color:var(--ink-dim);gap:8px}
  .coin-ico{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b3,var(--coin) 55%,#c9932a);box-shadow:0 0 6px rgba(255,209,102,.5)}
  .pearl-ico{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--pearl) 60%,#8fa6bd)}
  .mute{pointer-events:auto;margin-top:2px;padding:5px 10px;border-radius:12px;background:rgba(2,7,15,.55);border:1px solid var(--panel-edge);color:var(--ink-dim);font-size:11px;font-family:var(--display);letter-spacing:.05em}
  .mute.on{color:var(--coin);border-color:var(--brass-dark)}

  /* ---------- SEA ---------- */
  .sea{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:18px;color:var(--coin);background:rgba(2,7,15,.7);padding:6px 14px;border-radius:20px;border:1px solid var(--panel-edge);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
  .banner{position:absolute;left:0;right:0;top:38%;z-index:3;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}
  .banner.show{opacity:1;transform:scale(1)}
  .banner b{display:block;font-family:var(--display);font-size:40px;font-weight:400;color:#fff;text-shadow:0 0 24px rgba(122,208,224,.8),0 2px 0 #000}
  .banner span{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.2em}
  .combo{position:absolute;right:16px;top:118px;z-index:3;text-align:right;pointer-events:none;opacity:0;transition:opacity .2s}
  .combo.show{opacity:1}
  .combo b{display:block;font-family:var(--display);font-size:34px;line-height:1;font-weight:400;color:#fff;text-shadow:0 0 16px var(--coin),0 2px 0 #000}
  .combo span{font-size:11px;color:var(--coin);letter-spacing:.15em}
  .boss{position:absolute;left:16px;right:16px;top:100px;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s}
  .boss.show{opacity:1}
  .boss .name{display:flex;justify-content:space-between;font-family:var(--display);font-size:15px;color:#ffb3b3;text-shadow:0 1px 0 #000}
  .boss .bar{height:10px;border-radius:5px;background:rgba(0,0,0,.5);border:1px solid rgba(255,107,107,.5);overflow:hidden;margin-top:4px}
  .boss .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b6b,#ff2d55);transition:width .1s}
  .mult{position:absolute;right:16px;bottom:12px;z-index:3;font-family:var(--display);font-size:15px;color:var(--abyss);background:var(--cta);padding:5px 12px;border-radius:14px;box-shadow:0 2px 10px rgba(255,176,32,.5)}
  .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;z-index:2;font-size:13px;color:var(--ink-dim);pointer-events:none;transition:opacity .4s}
  .vignette{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,60,60,.55) 100%)}
  .vignette.show{opacity:1}

  /* ---------- PANEL ---------- */
  .panel{position:relative;z-index:3;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--panel-edge);display:grid;gap:8px}
  .shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  button{font-family:var(--body);color:var(--ink);border:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
  .buy{display:grid;gap:2px;text-align:left;padding:8px 8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--panel-edge);transition:transform .08s,border-color .15s,background .15s;min-height:66px}
  .buy .name{font-family:var(--display);font-size:14px;line-height:1.1}
  .buy .lv{font-size:10px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .buy .cost{display:flex;align-items:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-mute);margin-top:3px}
  .buy .cost .coin-ico{width:10px;height:10px;box-shadow:none}
  .buy.ok{border-color:var(--brass-dark);background:linear-gradient(var(--panel-2),#12294a)}
  .buy.ok .cost{color:var(--coin)}
  .buy.ok:active{transform:scale(.96)}
  .buy.urgent{border-color:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}50%{box-shadow:0 0 0 4px rgba(255,107,107,.35)}}
  .ad{padding:12px;border-radius:10px;background:var(--cta);color:var(--abyss);font-family:var(--display);font-size:17px;line-height:1.1;display:grid;gap:2px;box-shadow:0 3px 0 #b87a12}
  .ad small{font-family:var(--body);font-size:11px;font-weight:500;opacity:.75}
  .ad:active{transform:translateY(2px);box-shadow:0 1px 0 #b87a12}
  .ad[disabled]{opacity:.55;box-shadow:none;transform:none}
  .prestige{padding:12px;border-radius:10px;font-family:var(--display);font-size:17px;background:linear-gradient(135deg,#223a5c,#0f2038);border:1px solid var(--pearl);color:var(--pearl);display:grid;gap:2px}
  .prestige small{font-family:var(--body);font-size:11px;color:var(--ink-dim)}
  .prestige[hidden]{display:none}

  /* ---------- MODALS ---------- */
  .modal{position:absolute;inset:0;z-index:10;background:rgba(2,7,15,.82);display:grid;place-items:center;padding:24px}
  .modal[hidden]{display:none}
  .sheet{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:16px;padding:20px;display:grid;gap:14px}
  .sheet h2{margin:0;font-family:var(--display);font-size:22px;font-weight:400;text-wrap:balance}
  .sheet p{margin:0;font-size:14px;color:var(--ink-dim);line-height:1.55}
  .sheet .big{font-family:var(--display);font-size:32px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{padding:12px;border-radius:10px;font-family:var(--display);font-size:16px;background:var(--panel-2);border:1px solid var(--panel-edge)}
  .btn.primary{background:var(--cta);color:var(--abyss);border-color:transparent}
  .relics{display:grid;gap:8px}
  .relic{text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--panel-edge);display:grid;gap:3px}
  .relic:active{border-color:var(--pearl)}
  .relic .rn{font-family:var(--display);font-size:16px;color:var(--pearl)}
  .relic .rd{font-size:13px;color:var(--ink-dim)}
  .adwatch{display:grid;place-items:center;text-align:center;gap:10px}
  .adwatch .count{font-family:var(--display);font-size:56px;color:var(--cta);line-height:1}
  .adwatch p{color:var(--ink-mute);font-size:12px}
  .chest{display:grid;place-items:center;text-align:center;gap:8px}
  .chest .big{justify-content:center;color:var(--coin)}
  @media (prefers-reduced-motion:reduce){.toast,.buy,.banner,.combo{transition:none}.buy.urgent{animation:none}}
</style></head><body>

<div class="app" id="app">
  <div class="hud">
    <div class="depth">
      <div class="num"><span id="depth">0</span><small>m</small></div>
      <div class="zone" id="zone">햇빛층</div>
      <div class="hull" id="hull"><span>선체</span><div class="bar"><i id="hull-bar"></i></div><span id="hull-txt">600m</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="coin-ico"></span><span id="coins">0</span></div>
      <div class="stat sub">
        <span><span class="pearl-ico" style="display:inline-block;vertical-align:-1px"></span> <span id="pearls">0</span></span>
        <span>도감 <span id="dex">0</span>/9</span>
      </div>
      <a href="./guard-the-shop.html" style="color:#9fb8c9;font-size:12px;text-decoration:none">지키는 가게 ↗</a><button class="mute on" id="b-mute">SOUND ON</button>
    </div>
  </div>

  <div class="sea">
    <canvas id="sea"></canvas>
    <div class="vignette" id="vig"></div>
    <div class="toast" id="toast"></div>
    <div class="banner" id="banner"><b>중층</b><span>300m</span></div>
    <div class="combo" id="combo"><b>x1.0</b><span>COMBO 3</span></div>
    <div class="boss" id="bossbar"><div class="name"><span id="boss-name">대왕 문어</span><span id="boss-t">25s</span></div><div class="bar"><i id="boss-hp"></i></div></div>
    <div class="mult" id="mult" hidden>×2 <span id="multT">30</span>s</div>
    <div class="hint" id="hint">물고기를 탭해서 잡으세요</div>
  </div>

  <div class="panel">
    <div class="shop">
      <button class="buy" id="b-net"><span class="name">그물</span><span class="lv" id="net-lv">Lv.1</span><span class="cost"><span class="coin-ico"></span><span id="net-cost">30</span></span></button>
      <button class="buy" id="b-drone"><span class="name">드론</span><span class="lv" id="drone-lv">0대</span><span class="cost"><span class="coin-ico"></span><span id="drone-cost">50</span></span></button>
      <button class="buy" id="b-engine"><span class="name">엔진</span><span class="lv" id="engine-lv">Lv.1</span><span class="cost"><span class="coin-ico"></span><span id="engine-cost">40</span></span></button>
      <button class="buy" id="b-hull"><span class="name">선체</span><span class="lv" id="hull-lv">Lv.1</span><span class="cost"><span class="coin-ico"></span><span id="hull-cost">200</span></span></button>
    </div>
    <button class="ad" id="b-ad"><span>광고 보고 30초 동안 코인 ×2</span><small>프로토타입 — 실제 광고는 재생되지 않습니다</small></button>
    <button class="prestige" id="b-prestige" hidden><span>수면으로 귀환 · 진주 +<span id="pearl-gain">1</span></span><small>수심·코인·장비 초기화, 진주당 코인 +25% 영구, 유물 1개 선택</small></button>
  </div>

  <div class="modal" id="m-offline" hidden>
    <div class="sheet">
      <h2>잠수정이 혼자 일했습니다</h2>
      <p id="off-desc"></p>
      <div class="big"><span class="coin-ico"></span><span id="off-amt">0</span></div>
      <div class="row"><button class="btn" id="off-take">받기</button><button class="btn primary" id="off-double">광고 보고 ×2</button></div>
    </div>
  </div>
  <div class="modal" id="m-relic" hidden>
    <div class="sheet">
      <h2>심해에서 건진 유물</h2>
      <p>셋 중 하나만 가져갈 수 있습니다. 다음 잠항부터 영구 적용됩니다.</p>
      <div class="relics" id="relic-list"></div>
    </div>
  </div>
  <div class="modal" id="m-ad" hidden>
    <div class="sheet adwatch"><div class="count" id="ad-count">3</div><h2>광고 시청 중</h2><p>실제 앱에서는 여기서 보상형 광고 SDK(AdMob 등)가 재생됩니다</p></div>
  </div>
  <div class="modal" id="m-chest" hidden>
    <div class="sheet chest">
      <h2 id="chest-title">보스를 쓰러뜨렸다!</h2>
      <p id="chest-desc">문어가 품고 있던 보물 상자</p>
      <div class="big"><span class="coin-ico"></span><span id="chest-amt">0</span></div>
      <p id="chest-extra"></p>
      <button class="btn primary" id="chest-take" style="width:100%">챙기기</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const SAVE_KEY = 'abyss-diver-v2';
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 데이터 ----------
  const SPECIES = [
    { id:'sardine',  name:'정어리',     minD:0,    maxD:450,      value:5,   color:'#bfe3ee', size:13, speed:70,  w:10 },
    { id:'seahorse', name:'해마',       minD:80,   maxD:600,      value:14,  color:'#ffd27a', size:14, speed:40,  w:5,  zig:true },
    { id:'jelly',    name:'해파리',     minD:250,  maxD:950,      value:22,  color:'#ff8f73', size:17, speed:22,  w:7 },
    { id:'eel',      name:'전기뱀장어', minD:450,  maxD:1300,     value:60,  color:'#9dffb8', size:22, speed:95,  w:3,  shock:true },
    { id:'lantern',  name:'초롱아귀',   minD:700,  maxD:Infinity, value:85,  color:'#c3a3ff', size:19, speed:38,  w:6 },
    { id:'shark',    name:'심해 상어',  minD:600,  maxD:1800,     value:220, color:'#8fa6bd', size:34, speed:120, w:2,  bite:true },
    { id:'ghost',    name:'유령고기',   minD:900,  maxD:Infinity, value:160, color:'#d8f0ff', size:16, speed:30,  w:4,  ghost:true },
    { id:'squid',    name:'대왕오징어', minD:1100, maxD:Infinity, value:340, color:'#7ad0e0', size:30, speed:50,  w:1,  rare:true },
  ];
  const BOSS = { id:'octopus', name:'대왕 문어' };
  const RELICS = [
    { id:'goldnet',  name:'황금 그물',   desc:'모든 코인 획득 +50%',        coin:1.5 },
    { id:'twin',     name:'쌍둥이 드론', desc:'드론 포획 속도 2배',          drone:2 },
    { id:'engine',   name:'심해 엔진',   desc:'하강 속도 +40%',              engine:1.4 },
    { id:'charm',    name:'산호 부적',   desc:'잠항 시작 시 코인 500 지급',   start:500 },
    { id:'lure',     name:'빛나는 미끼', desc:'물고기 출현 빈도 2배',         spawn:2 },
    { id:'sonar',    name:'광역 소나',   desc:'그물 반경 +30',               net:30 },
    { id:'plating',  name:'티타늄 장갑', desc:'선체 한계 +400m',             hull:400 },
    { id:'harpoon',  name:'작살 발사기', desc:'보스에게 탭당 2배 피해',       harpoon:2 },
  ];
  const ZONES = [[0,'햇빛층'],[300,'중층'],[800,'심해'],[1500,'무광층'],[2500,'해구']];
  const BG = [
    [0,    [27,111,158], [11,61,99]],
    [300,  [11,61,99],   [6,33,60]],
    [800,  [6,33,60],    [2,7,15]],
    [2000, [2,7,15],     [0,0,0]],
    [3500, [10,2,6],     [0,0,0]],
  ];
  const HULL_MAX = [600, 1200, 2000, 3200, 5000, 8000, Infinity];

  // ---------- 상태 ----------
  const fresh = () => ({
    coins:0, depth:0, net:1, drones:0, engine:1, hull:1,
    pearls:0, relics:[], caught:{}, adUntil:0, lastSeen:Date.now(), runs:0, bossBeaten:0, sound:true, best:0,
  });
  let S = fresh();

  const relicMul = key => S.relics.reduce((m, id) => m * ((RELICS.find(r => r.id === id) || {})[key] || 1), 1);
  const relicAdd = key => S.relics.reduce((m, id) => m + ((RELICS.find(r => r.id === id) || {})[key] || 0), 0);
  let combo = 0, comboT = 0;
  const comboMul = () => 1 + 0.1 * Math.min(20, Math.max(0, combo - 1));
  const coinMul  = () => (1 + 0.25 * S.pearls) * relicMul('coin') * (S.adUntil > Date.now() ? 2 : 1);
  const netR     = () => 40 + 15 * S.net + relicAdd('net');
  const engineV  = () => 5 * (1 + 0.6 * (S.engine - 1)) * relicMul('engine');
  const droneCD  = () => 2.4 / relicMul('drone');
  const hullMax  = () => HULL_MAX[Math.min(S.hull - 1, HULL_MAX.length - 1)] + relicAdd('hull');
  const costNet    = () => Math.floor(30 * Math.pow(1.6, S.net - 1));
  const costDrone  = () => Math.floor(50 * Math.pow(1.5, S.drones));
  const costEngine = () => Math.floor(40 * Math.pow(1.7, S.engine - 1));
  const costHull   = () => Math.floor(200 * Math.pow(2.3, S.hull - 1));
  const zoneName = d => { let z = ZONES[0][1]; for (const [m, n] of ZONES) if (d >= m) z = n; return z; };

  function fmt(n){
    if (n < 1000) return Math.floor(n).toLocaleString('ko-KR');
    const u = ['K','M','B','T']; let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + u[i];
  }

  // ---------- 저장 ----------
  const serialize = () => ({ ...S, lastSeen: Date.now() });
  function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (_) {} }
  function load(){ try { const j = localStorage.getItem(SAVE_KEY) || localStorage.getItem('abyss-diver-v1'); return j ? JSON.parse(j) : null; } catch (_) { return null; } }

  // ---------- 사운드 (전부 합성) ----------
  const AU = { ctx:null, master:null, amb:null, ambGain:null, tension:null, tensionGain:null, creakT:0 };
  function audio(){
    if (!AU.ctx) { try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); AU.master = AU.ctx.createGain(); AU.master.gain.value = S.sound ? 1 : 0; AU.master.connect(AU.ctx.destination); } catch (_) { return null; } }
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
    return AU.ctx;
  }
  function tone(f, dur, type, vol, slide, cut){
    const c = audio(); if (!c || !S.sound) return;
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = type || 'sine'; lp.type = 'lowpass'; lp.frequency.value = cut || 1400;
    o.frequency.setValueAtTime(f, c.currentTime); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(lp).connect(g).connect(AU.master); o.start(); o.stop(c.currentTime + dur + 0.05);
  }

    drones.forEach(d => { cx.fillStyle = '#f2b950'; cx.beginPath(); cx.arc(d.x, d.y, 6, 0, 6.28); cx.fill(); cx.fillStyle = Math.sin(t * 8 + d.a) > 0 ? '#7ad0e0' : '#1b3a55'; cx.beginPath(); cx.arc(d.x + 2, d.y - 2, 2, 0, 6.28); cx.fill(); cx.strokeStyle = 'rgba(242,185,80,.5)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(d.x - 9, d.y - 5); cx.lineTo(d.x + 9, d.y - 5); cx.stroke(); });
    rings.forEach(r => { const k = r.t / .4; cx.strokeStyle = `rgba(255,209,102,${1 - k})`; cx.lineWidth = 2.5 - k * 2; cx.beginPath(); cx.arc(r.x, r.y, r.R * Math.min(1, k * 2.2), 0, 6.28); cx.stroke(); });
    sparks.forEach(p => { cx.globalAlpha = 1 - p.t / .6; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 2.4, 0, 6.28); cx.fill(); }); cx.globalAlpha = 1;
    flyers.forEach(p => { if (p.t < 0) return; cx.fillStyle = '#ffd166'; cx.beginPath(); cx.arc(p.x, p.y, 5, 0, 6.28); cx.fill(); cx.fillStyle = '#fff2b3'; cx.beginPath(); cx.arc(p.x - 1.5, p.y - 1.5, 2, 0, 6.28); cx.fill(); });
    cx.textAlign = 'center';
    floats.forEach(f => { cx.font = (f.big ? 26 : 18) + 'px Jua, "Noto Sans KR", sans-serif'; cx.globalAlpha = 1 - f.t; cx.fillStyle = f.c; cx.fillText(f.text, f.x, f.y - f.t * 40); }); cx.globalAlpha = 1;
    // 선체 균열
    cracks.forEach(c => { cx.strokeStyle = `rgba(255,255,255,${.5 * (1 - c.t / 1.2)})`; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(c.x, c.y); let x = c.x, y = c.y; for (let i = 0; i < 5; i++) { x += Math.cos(c.a + (Math.random() - .5)) * 14; y += Math.sin(c.a + (Math.random() - .5)) * 14; cx.lineTo(x, y); } cx.stroke(); });
    cx.restore();
    if (flash > 0) { cx.globalAlpha = flash * .5; cx.fillStyle = flashC; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
  }

  function drawFish(f){
    const s = f.size, dir = Math.sign(f.vx) || 1;
    cx.save(); cx.translate(f.x, f.y); cx.scale(dir, 1);
    if (f.sp.ghost) cx.globalAlpha = inLight(f.x, f.y) ? .95 : .12;
    if (f.sp.id === 'jelly') {
      cx.fillStyle = f.sp.color; cx.globalAlpha = .85; cx.beginPath(); cx.arc(0, 0, s * .8, Math.PI, 0); cx.lineTo(s * .8, 3); cx.lineTo(-s * .8, 3); cx.fill();
      cx.strokeStyle = f.sp.color; cx.lineWidth = 1.5; cx.globalAlpha = .6; for (let i = -2; i <= 2; i++) { cx.beginPath(); cx.moveTo(i * s * .3, 3); cx.quadraticCurveTo(i * s * .3 + Math.sin(f.ph + i) * 6, s * .9, i * s * .3 + Math.sin(f.ph * 1.3 + i) * 8, s * 1.6); cx.stroke(); }
    } else if (f.sp.id === 'lantern') {
      const lg = cx.createRadialGradient(s * .9, -s * .7, 0, s * .9, -s * .7, s * 1.3); lg.addColorStop(0, 'rgba(255,250,200,.9)'); lg.addColorStop(1, 'rgba(255,250,200,0)'); cx.fillStyle = lg; cx.beginPath(); cx.arc(s * .9, -s * .7, s * 1.3, 0, 6.28); cx.fill();
      cx.fillStyle = f.sp.color; cx.beginPath(); cx.ellipse(0, 0, s * .9, s * .65, 0, 0, 6.28); cx.fill(); cx.beginPath(); cx.moveTo(-s * .8, 0); cx.lineTo(-s * 1.4, -s * .5 + Math.sin(f.ph) * 3); cx.lineTo(-s * 1.4, s * .5 + Math.sin(f.ph) * 3); cx.fill();
      cx.strokeStyle = f.sp.color; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(s * .4, -s * .5); cx.quadraticCurveTo(s * .9, -s * 1.1, s * .9, -s * .7); cx.stroke(); cx.fillStyle = '#fff8c8'; cx.beginPath(); cx.arc(s * .9, -s * .7, 3, 0, 6.28); cx.fill(); cx.fillStyle = '#1a0f2e'; cx.beginPath(); cx.arc(s * .4, -s * .1, 2.5, 0, 6.28); cx.fill();
    } else if (f.sp.id === 'squid') {
      cx.fillStyle = f.sp.color; cx.globalAlpha = .9; cx.beginPath(); cx.ellipse(0, 0, s * 1.1, s * .35, 0, 0, 6.28); cx.fill(); cx.beginPath(); cx.moveTo(s * .6, -s * .3); cx.lineTo(s * 1.5, 0); cx.lineTo(s * .6, s * .3); cx.fill();
      cx.strokeStyle = f.sp.color; cx.lineWidth = 2; for (let i = -2; i <= 2; i++) { cx.beginPath(); cx.moveTo(-s * .9, i * 3); cx.quadraticCurveTo(-s * 1.5, i * 6 + Math.sin(f.ph + i) * 6, -s * 2.2, i * 8 + Math.sin(f.ph * 1.2 + i) * 8); cx.stroke(); } cx.fillStyle = '#0a1d2e'; cx.beginPath(); cx.arc(-s * .3, -s * .1, 3.5, 0, 6.28); cx.fill();
    } else if (f.sp.id === 'shark') {
      cx.fillStyle = f.sp.color; cx.beginPath(); cx.ellipse(0, 0, s, s * .32, 0, 0, 6.28); cx.fill();
      cx.beginPath(); cx.moveTo(-s * .2, -s * .25); cx.lineTo(0, -s * .85); cx.lineTo(s * .25, -s * .25); cx.fill();
      const tw = Math.sin(f.ph * 1.5) * 5; cx.beginPath(); cx.moveTo(-s * .9, 0); cx.lineTo(-s * 1.35, -s * .55 + tw); cx.lineTo(-s * 1.2, tw); cx.lineTo(-s * 1.35, s * .45 + tw); cx.fill();
      cx.fillStyle = '#dfe9f5'; cx.beginPath(); cx.ellipse(s * .1, s * .12, s * .7, s * .14, 0, 0, 6.28); cx.fill();
      cx.fillStyle = '#ff2d55'; cx.beginPath(); cx.arc(s * .6, -s * .08, 2.5, 0, 6.28); cx.fill();
      cx.strokeStyle = '#fff'; cx.lineWidth = 1.5; cx.beginPath(); for (let i = 0; i < 4; i++) { cx.moveTo(s * .55 + i * 4, s * .1); cx.lineTo(s * .57 + i * 4, s * .2); } cx.stroke();
    } else if (f.sp.id === 'eel') {
      cx.strokeStyle = f.sp.color; cx.lineWidth = 5; cx.lineCap = 'round'; cx.beginPath(); for (let i = 0; i <= 8; i++) { const x = -s + i * s * .25, y = Math.sin(f.ph + i * .8) * 6; i ? cx.lineTo(x, y) : cx.moveTo(x, y); } cx.stroke();
      if (Math.sin(t * 20) > 0.3) { cx.strokeStyle = '#fff'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(-s * .5, -8); cx.lineTo(-s * .3, 8); cx.lineTo(0, -8); cx.stroke(); }
      cx.fillStyle = '#0a1d2e'; cx.beginPath(); cx.arc(s * .95, Math.sin(f.ph + 6.4) * 6 - 1, 2, 0, 6.28); cx.fill();
    } else if (f.sp.id === 'seahorse') {
      cx.strokeStyle = f.sp.color; cx.lineWidth = 4; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(0, -s); cx.quadraticCurveTo(s * .5, -s * .5, 0, 0); cx.quadraticCurveTo(-s * .6, s * .5, s * .2, s * .9); cx.stroke();
      cx.fillStyle = f.sp.color; cx.beginPath(); cx.ellipse(0, -s, s * .35, s * .25, 0, 0, 6.28); cx.fill(); cx.fillStyle = '#0a1d2e'; cx.beginPath(); cx.arc(s * .1, -s * 1.05, 1.5, 0, 6.28); cx.fill();
    } else if (f.sp.id === 'ghost') {
      cx.fillStyle = f.sp.color; cx.beginPath(); cx.ellipse(0, 0, s, s * .5, 0, 0, 6.28); cx.fill(); cx.beginPath(); cx.moveTo(-s * .8, 0); cx.lineTo(-s * 1.5, -s * .6 + Math.sin(f.ph) * 4); cx.lineTo(-s * 1.5, s * .6 + Math.sin(f.ph) * 4); cx.fill();
      cx.fillStyle = '#1a2a3e'; cx.beginPath(); cx.arc(s * .5, -s * .1, 3, 0, 6.28); cx.fill();
    } else {
      cx.fillStyle = f.sp.color; cx.beginPath(); cx.ellipse(0, 0, s, s * .42, 0, 0, 6.28); cx.fill();
      const tw = Math.sin(f.ph) * 4; cx.beginPath(); cx.moveTo(-s * .85, 0); cx.lineTo(-s * 1.35, -s * .45 + tw); cx.lineTo(-s * 1.35, s * .45 + tw); cx.fill();
      cx.fillStyle = 'rgba(255,255,255,.35)'; cx.beginPath(); cx.ellipse(s * .1, -s * .1, s * .6, s * .15, 0, 0, 6.28); cx.fill(); cx.fillStyle = '#0a1d2e'; cx.beginPath(); cx.arc(s * .55, -s * .08, 2, 0, 6.28); cx.fill();
    }
    cx.restore(); cx.globalAlpha = 1;
  }

  function drawBoss(){
    const b = boss; cx.save(); cx.translate(b.x, b.y);
    const col = b.hurt > 0 ? '#ffffff' : '#a03a6a';
    cx.strokeStyle = col; cx.lineWidth = 9; cx.lineCap = 'round';
    for (let i = 0; i < 8; i++) { const a = (i / 8) * 6.28 + b.ph * .3; cx.beginPath(); cx.moveTo(Math.cos(a) * 30, Math.sin(a) * 26); cx.quadraticCurveTo(Math.cos(a) * 70 + Math.sin(b.ph * 2 + i) * 18, Math.sin(a) * 60, Math.cos(a) * 95 + Math.sin(b.ph * 2.5 + i) * 22, Math.sin(a) * 85 + Math.cos(b.ph * 2 + i) * 12); cx.stroke(); }
    const rg = cx.createRadialGradient(-10, -14, 5, 0, 0, 52); rg.addColorStop(0, b.hurt > 0 ? '#fff' : '#d85a9a'); rg.addColorStop(1, col); cx.fillStyle = rg; cx.beginPath(); cx.ellipse(0, -6, 48, 42, 0, 0, 6.28); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(-16, -8, 10, 0, 6.28); cx.arc(16, -8, 10, 0, 6.28); cx.fill();
    cx.fillStyle = '#1a0f2e'; const ex = Math.sin(b.ph) * 3; cx.beginPath(); cx.arc(-16 + ex, -8, 5, 0, 6.28); cx.arc(16 + ex, -8, 5, 0, 6.28); cx.fill();
    cx.strokeStyle = '#1a0f2e'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(-28, -24); cx.lineTo(-8, -16); cx.moveTo(28, -24); cx.lineTo(8, -16); cx.stroke();
    cx.restore();
  }

  function drawSub(p){
    cx.save(); cx.translate(p.x, p.y);
    cx.strokeStyle = '#c9c9c9'; cx.lineWidth = 2; for (let i = 0; i < 3; i++) { const a = prop + i * 2.09; cx.beginPath(); cx.moveTo(34, 0); cx.lineTo(34 + Math.cos(a) * 2, Math.sin(a) * 9); cx.stroke(); }
    const hg = cx.createLinearGradient(0, -18, 0, 18); hg.addColorStop(0, '#f7cf7a'); hg.addColorStop(.55, '#f2b950'); hg.addColorStop(1, '#a8751f'); cx.fillStyle = hg; cx.beginPath(); cx.ellipse(0, 0, 36, 17, 0, 0, 6.28); cx.fill();
    if (S.hull >= 3) { cx.strokeStyle = 'rgba(223,233,245,.7)'; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(0, 0, 36, 17, 0, 0, 6.28); cx.stroke(); }
    cx.fillStyle = '#d9a03a'; cx.fillRect(-8, -26, 18, 12); cx.fillStyle = '#a8751f'; cx.fillRect(-8, -16, 18, 3);
    cx.fillStyle = '#e0c27a'; cx.fillRect(2, -34, 3, 9); cx.fillRect(2, -34, 8, 3);
    cx.fillStyle = 'rgba(80,50,10,.45)'; for (let x = -24; x <= 24; x += 12) { cx.beginPath(); cx.arc(x, 12, 1.4, 0, 6.28); cx.fill(); }
    const pg = cx.createRadialGradient(-10, -3, 1, -10, -3, 9); pg.addColorStop(0, '#dff6ff'); pg.addColorStop(1, '#2b7ea5'); cx.fillStyle = pg; cx.beginPath(); cx.arc(-10, -2, 8, 0, 6.28); cx.fill(); cx.strokeStyle = '#a8751f'; cx.lineWidth = 2.5; cx.stroke();
    cx.fillStyle = 'rgba(255,255,255,.7)'; cx.beginPath(); cx.arc(-13, -5, 2, 0, 6.28); cx.fill();
    cx.fillStyle = '#fff3c4'; cx.beginPath(); cx.ellipse(-34, 0, 4, 6, 0, 0, 6.28); cx.fill();
    cx.restore();
  }

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const hint = $('hint');
  let toastT = null, bannerT = null;
  function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
  function banner(big, small){ const el = $('banner'); el.querySelector('b').textContent = big; el.querySelector('span').textContent = small; el.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => el.classList.remove('show'), 2200); }

  function renderUI(){
    $('depth').textContent = Math.floor(S.depth).toLocaleString('ko-KR');
    $('zone').textContent = zoneName(S.depth);
    $('coins').textContent = fmt(S.coins); $('pearls').textContent = S.pearls; $('dex').textContent = Object.keys(S.caught).length;
    const max = hullMax(), k = Math.min(1, S.depth / max), atLimit = S.depth >= max;
    $('hull-bar').style.width = (k * 100) + '%'; $('hull-txt').textContent = isFinite(max) ? fmt(max) + 'm' : '∞'; $('hull').classList.toggle('warn', k > .85);
    $('vig').classList.toggle('show', atLimit || shockT > 0);
    $('net-lv').textContent = `Lv.${S.net} · 반경 ${netR()}`;
    $('drone-lv').textContent = `${S.drones}대${S.drones ? ' · ' + droneCD().toFixed(1) + 's' : ''}`;
    $('engine-lv').textContent = `Lv.${S.engine} · ${engineV().toFixed(0)}m/s`;
    $('hull-lv').textContent = `Lv.${S.hull} · ${isFinite(max) ? fmt(max) + 'm' : '∞'}`;
    [['net', costNet()], ['drone', costDrone()], ['engine', costEngine()], ['hull', costHull()]].forEach(([n, v]) => { $(n + '-cost').textContent = fmt(v); $('b-' + n).classList.toggle('ok', S.coins >= v); });
    $('b-hull').classList.toggle('urgent', atLimit && isFinite(max));
    const adOn = S.adUntil > Date.now(); $('mult').hidden = !adOn; $('b-ad').disabled = adOn; if (adOn) $('multT').textContent = Math.ceil((S.adUntil - Date.now()) / 1000);
    const gain = Math.floor(S.depth / 1000); $('b-prestige').hidden = gain < 1; $('pearl-gain').textContent = gain;
    const cb = $('combo'); cb.classList.toggle('show', combo >= 3); if (combo >= 3) { cb.querySelector('b').textContent = 'x' + comboMul().toFixed(1); cb.querySelector('span').textContent = 'COMBO ' + combo; }
    const bb = $('bossbar'); bb.classList.toggle('show', !!boss); if (boss) { $('boss-hp').style.width = Math.max(0, boss.hp / boss.max * 100) + '%'; $('boss-t').textContent = Math.ceil(boss.life) + 's'; }
    if (atLimit && isFinite(max) && !boss) { hint.textContent = '선체 한계 — 더 내려가려면 선체를 강화하세요'; hint.style.opacity = 1; } else if (hint.textContent !== '물고기를 탭해서 잡으세요') { hint.style.opacity = 0; }
  }

  const buy = (cost, apply, msg) => { audio(); ambient(); const c = cost(); if (S.coins < c) { SFX.deny(); return; } S.coins -= c; apply(); SFX.buy(); toast(msg()); };
  $('b-net').onclick = () => buy(costNet, () => S.net++, () => `그물 반경 ${netR()}`);
  $('b-drone').onclick = () => buy(costDrone, () => S.drones++, () => S.drones === 1 ? '드론이 알아서 잡기 시작합니다' : `드론 ${S.drones}대`);
  $('b-engine').onclick = () => buy(costEngine, () => S.engine++, () => `하강 ${engineV().toFixed(0)} m/s`);
  $('b-hull').onclick = () => buy(costHull, () => S.hull++, () => `선체 강화 · ${isFinite(hullMax()) ? fmt(hullMax()) + 'm까지' : '한계 없음'}`);
  $('b-mute').onclick = () => { S.sound = !S.sound; audio(); if (AU.master) AU.master.gain.value = S.sound ? 1 : 0; $('b-mute').textContent = S.sound ? 'SOUND ON' : 'SOUND OFF'; $('b-mute').classList.toggle('on', S.sound); if (S.sound) { ambient(); SFX.buy(); } };

  function watchAd(then){ const m = $('m-ad'), cnt = $('ad-count'); let n = 3; cnt.textContent = n; m.hidden = false; const iv = setInterval(() => { n--; cnt.textContent = n; if (n <= 0) { clearInterval(iv); m.hidden = true; then(); } }, 700); }
  $('b-ad').onclick = () => watchAd(() => { S.adUntil = Date.now() + 30000; toast('30초 동안 코인 ×2'); SFX.buy(); });

  $('b-prestige').onclick = () => {
    const pool = [...RELICS].filter(r => !S.relics.includes(r.id) || r.id === 'charm').sort(() => Math.random() - .5).slice(0, 3);
    const list = $('relic-list'); list.innerHTML = '';
    pool.forEach(r => { const b = document.createElement('button'); b.className = 'relic'; b.innerHTML = `<span class="rn">${r.name}</span><span class="rd">${r.desc}</span>`;
      b.onclick = () => { const gain = Math.floor(S.depth / 1000); S.pearls += gain; S.relics.push(r.id); S.runs++; S.depth = 0; S.net = 1; S.drones = 0; S.engine = 1; S.hull = 1; S.bossBeaten = 0; S.coins = relicAdd('start'); fish.length = 0; drones.length = 0; boss = null; setTension(false); lastZone = ''; $('m-relic').hidden = true; SFX.prestige(); banner('수면으로 귀환', `진주 ${S.pearls}개 · 코인 +${S.pearls * 25}%`); save(); };
      list.appendChild(b); });
    $('m-relic').hidden = false;
  };

  function offline(prev){
    if (!prev || !prev.drones) return;
    const away = Math.min(Date.now() - (prev.lastSeen || Date.now()), 8 * 3600e3) / 1000; if (away < 60) return;
    const avg = S.depth >= 700 ? 80 : S.depth >= 250 ? 20 : 5;
    const amt = Math.floor(prev.drones * (away / droneCD()) * avg * .6 * coinMul()); if (amt < 1) return;
    const min = Math.floor(away / 60);
    $('off-desc').textContent = `자리를 비운 ${min >= 60 ? Math.floor(min / 60) + '시간 ' + (min % 60) + '분' : min + '분'} 동안 드론 ${prev.drones}대가 물고기를 잡았습니다.`;
    $('off-amt').textContent = fmt(amt);
    $('off-take').onclick = () => { S.coins += amt; $('m-offline').hidden = true; };
    $('off-double').onclick = () => { $('m-offline').hidden = true; watchAd(() => { S.coins += amt * 2; toast(`코인 +${fmt(amt * 2)}`); }); };
    $('m-offline').hidden = false;
  }

  // ---------- 부팅 ----------
  let last = 0;
  function frame(now){ const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; update(dt); draw(); renderUI(); requestAnimationFrame(frame); }
  function start(hot){
    const prev = (hot && hot.coins != null) ? hot : load();
    if (prev) S = { ...fresh(), ...prev, caught: prev.caught || {}, relics: prev.relics || [], hull: prev.hull || 1, bossBeaten: prev.bossBeaten || 0, sound: prev.sound !== false };
    if (S.adUntil < Date.now()) S.adUntil = 0;
    if (!(hot && hot.coins != null)) offline(prev);
    if (S.runs || S.coins > 0) hint.style.opacity = 0;
    lastZone = zoneName(S.depth);
    $('b-mute').textContent = S.sound ? 'SOUND ON' : 'SOUND OFF'; $('b-mute').classList.toggle('on', S.sound);
    requestAnimationFrame(frame); setInterval(save, 2000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  }
  window.claude?.hot?.snapshot?.(serialize);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
})();
</script>
</body></html>
